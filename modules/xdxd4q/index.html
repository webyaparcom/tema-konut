<section class="modulex-shn{{shnsinif}}" aria-labelledby="shn-{{id}}-baslik">
  <div class="modulex-shn-sahne">
    <div class="modulex-shn-medya" data-wm-ai-yuva="hero" data-sure="{{shnsure}}">
      {{shnmedya}}
      {{shnkontrol}}
    </div>
    <div class="modulex-shn-kart">
      {{shnust}}
      <h1 class="modulex-shn-baslik" id="shn-{{id}}-baslik">{{shnbaslik}}</h1>
      <div class="modulex-shn-yan">
        {{shnmetin}}
        {{shnctalar}}
      </div>
    </div>
  </div>
  {{shnasagi}}
</section>

<style>
  /* hero-sahne — sahne hero (15 Kas 2026, G3 · D19). Medya tam genişlik değil: yuvarlak köşeli «sahne» çerçevesinde durur.
     cerceve: metin kartı medyanın başlangıç-alt köşesine biner · sinema: 21:9 bant, başlık ve metin altında iki sütun.
     Video: ≤30 sn sessiz döngü, poster zorunlu, oynat/durdur düğmesi + ilerleme halkası; reduced-motion'da poster.
     Renkler yalnız desing anahtarından (var(--mx-site-*) varsayılanlı); mantıksal CSS → RTL. */
  .modulex-shn {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    padding: 20px 16px 56px;
    background: --bg--;
    color: --text--;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-shn *,
  .modulex-shn *::before,
  .modulex-shn *::after { box-sizing: border-box; }
  .modulex-shn-sahne { position: relative; max-width: --max--; margin-inline: auto; }

  .modulex-shn-medya {
    position: relative;
    overflow: hidden;
    height: clamp(460px, 76vh, 820px);
    border-radius: --yuvarlak--;
    background: --medyaBg--;
    isolation: isolate;
  }
  .modulex-shn-poster,
  .modulex-shn-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: modulex-shn-zoom 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .modulex-shn-video { z-index: 1; }
  .modulex-shn-medya::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to top, color-mix(in srgb, --kontrolBg-- --karartma--, transparent), transparent 55%);
  }
  .modulex-shn-yuva {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 25% 30%, color-mix(in srgb, --accent-- 55%, transparent), transparent 55%),
      radial-gradient(circle at 80% 70%, color-mix(in srgb, --accent-- 30%, --medyaBg--), transparent 60%),
      --medyaBg--;
    color: color-mix(in srgb, --accentText-- 70%, transparent);
  }
  .modulex-shn-yuva .material-symbols-outlined { font-size: 64px; }
  .modulex-shn-yuva-isik {
    position: absolute;
    inset: -40%;
    background: conic-gradient(from 0deg, transparent, color-mix(in srgb, --accent-- 25%, transparent), transparent 30%);
    animation: modulex-shn-don 14s linear infinite;
  }

  .modulex-shn-kontrol {
    position: absolute;
    inset-block-end: 20px;
    inset-inline-end: 20px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: --kontrolBg--;
    color: --kontrolText--;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform 0.25s ease, background-color 0.25s ease;
  }
  .modulex-shn-kontrol:hover { transform: scale(1.06); }
  .modulex-shn-kontrol:focus-visible { outline: 3px solid --kontrolText--; outline-offset: 3px; }
  .modulex-shn-halka { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .modulex-shn-halka circle { fill: none; stroke: color-mix(in srgb, --kontrolText-- 25%, transparent); stroke-width: 3; }
  .modulex-shn-halka .modulex-shn-halka-dolu {
    stroke: --kontrolText--;
    stroke-dasharray: 100;
    stroke-dashoffset: calc(100 - var(--shn-ilerleme, 0) * 100);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear;
  }
  .modulex-shn-kontrol .material-symbols-outlined { position: relative; font-size: 26px; }
  .modulex-shn-kontrol[aria-pressed="true"] .modulex-shn-ikon-oynat,
  .modulex-shn-kontrol[aria-pressed="false"] .modulex-shn-ikon-durdur { display: none; }

  .modulex-shn-kart {
    position: absolute;
    inset-block-end: 28px;
    inset-inline-start: 28px;
    z-index: 4;
    width: min(560px, calc(100% - 120px));
    padding: 32px 34px;
    border-radius: calc(--yuvarlak-- * 0.75);
    background: --kartBg--;
    color: --text--;
    box-shadow: 0 30px 60px -30px color-mix(in srgb, --text-- 45%, transparent);
    animation: modulex-shn-gel 0.8s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .modulex-shn-ust {
    display: inline-block;
    margin: 0 0 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, --accent-- 14%, transparent);
    color: --accentInk--;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .modulex-shn-baslik {
    margin: 0;
    font-family: var(--mx-font-heading, inherit);
    font-size: clamp(2rem, 4.2vw, 3.6rem);
    font-weight: 750;
    letter-spacing: -0.025em;
    line-height: 1.04;
    overflow-wrap: anywhere;
  }
  html[lang="ar"] .modulex-shn-baslik,
  html[lang="fa"] .modulex-shn-baslik,
  html[lang="ur"] .modulex-shn-baslik,
  html[lang="he"] .modulex-shn-baslik { letter-spacing: 0; line-height: 1.3; font-weight: 600; }
  .modulex-shn-metin { margin: 14px 0 0; max-width: 46ch; color: --muted--; font-size: 1.05rem; line-height: 1.6; }
  .modulex-shn-ctalar { display: flex; flex-wrap: wrap; gap: 10px; margin-block-start: 22px; }
  .modulex-shn .modulex-shn-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 50px;
    padding-inline: 22px;
    border-radius: 999px;
    font-weight: 650;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, gap 0.25s ease, background-color 0.25s ease;
  }
  .modulex-shn .modulex-shn-cta--dolgu { background: --accent--; color: --accentText-- !important; }
  .modulex-shn .modulex-shn-cta--dolgu:hover { gap: 14px; }
  .modulex-shn .modulex-shn-cta--cizgi { border: 1.5px solid --text--; color: --text-- !important; }
  .modulex-shn .modulex-shn-cta--cizgi:hover { background: color-mix(in srgb, --text-- 8%, transparent); }
  .modulex-shn .modulex-shn-cta:focus-visible { outline: 2px solid --text--; outline-offset: 3px; }

  /* sinema: 21:9 bant + altında iki sütun metin (kart bindirmesi yok) */
  /* aspect-ratio + min-height birlikte min-genişliğe aktarılır (16:10 × 320px → 512px taşma) — sinemada min-height yok */
  .modulex-shn--sinema .modulex-shn-medya { height: auto; aspect-ratio: 21 / 9; min-height: 0; }
  .modulex-shn--sinema .modulex-shn-medya::after { background: none; }
  .modulex-shn--sinema .modulex-shn-kart {
    position: static;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 18px 48px;
    align-items: end;
    width: auto;
    padding: 36px 4px 0;
    background: transparent;
    box-shadow: none;
    animation-name: modulex-shn-yukari;
  }
  .modulex-shn--sinema .modulex-shn-ust { grid-column: 1 / -1; justify-self: start; margin: 0; }
  .modulex-shn--sinema .modulex-shn-baslik { font-size: clamp(2.2rem, 5.4vw, 4.6rem); }
  .modulex-shn--sinema .modulex-shn-metin { margin-block-start: 0; }

  .modulex-shn .modulex-shn-asagi {
    position: absolute;
    inset-block-end: 6px;
    left: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin-inline-start: -22px;
    border-radius: 50%;
    color: --text--;
    text-decoration: none;
    cursor: pointer;
    animation: modulex-shn-zipla 2.4s ease-in-out infinite;
  }
  [dir="rtl"] .modulex-shn .modulex-shn-asagi { margin-inline-start: 0; margin-inline-end: -22px; }
  .modulex-shn .modulex-shn-asagi:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  @keyframes modulex-shn-zoom { from { transform: scale(1.06); } to { transform: none; } }
  @keyframes modulex-shn-gel { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes modulex-shn-yukari { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes modulex-shn-don { to { transform: rotate(360deg); } }
  @keyframes modulex-shn-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

  @media (max-width: 1024px) {
    .modulex-shn-kart { width: min(520px, calc(100% - 100px)); padding: 26px 28px; }
    .modulex-shn--sinema .modulex-shn-kart { grid-template-columns: minmax(0, 1fr); padding-block-start: 26px; }
  }
  @media (max-width: 768px) {
    .modulex-shn { padding: 10px 10px 52px; }
    .modulex-shn-medya { height: auto; aspect-ratio: 4 / 5; max-height: 72vh; min-width: 0; }
    .modulex-shn--sinema .modulex-shn-medya { aspect-ratio: 16 / 10; min-height: 0; }
    .modulex-shn-medya::after { background: none; }
    .modulex-shn-kart,
    .modulex-shn--sinema .modulex-shn-kart {
      position: relative;
      inset: auto;
      width: auto;
      margin: -56px 12px 0;
      padding: 24px 22px;
    }
    .modulex-shn--sinema .modulex-shn-kart { margin: 0; padding: 22px 4px 0; }
    .modulex-shn-kontrol { inset-block-start: 14px; inset-block-end: auto; inset-inline-end: 14px; width: 48px; height: 48px; }
    .modulex-shn .modulex-shn-cta { flex: 1 1 auto; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-shn *,
    .modulex-shn-yuva-isik { transition: none !important; animation: none !important; }
    .modulex-shn--video .modulex-shn-video { display: none; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-shn");
    if (!kok || kok.dataset.shnHazir) return;
    kok.dataset.shnHazir = "1";

    /* aşağı ok: bir sonraki bölüme kaydır */
    kok.querySelector(".modulex-shn-asagi")?.addEventListener("click", (e) => {
      e.preventDefault();
      const sonraki = kok.nextElementSibling;
      const azHareket = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const y = sonraki ? sonraki.getBoundingClientRect().top + window.scrollY : kok.getBoundingClientRect().bottom + window.scrollY;
      window.scrollTo({ top: y, behavior: azHareket ? "auto" : "smooth" });
    });

    const video = kok.querySelector(".modulex-shn-video");
    const dugme = kok.querySelector(".modulex-shn-kontrol");
    if (!video || !dugme) return;
    const sure = Math.min(30, Number(kok.querySelector("[data-sure]")?.dataset.sure) || 30);
    const azHareket = window.matchMedia("(prefers-reduced-motion: reduce)");
    let kullaniciDurdurdu = false;

    const durum = () => {
      const oynuyor = !video.paused && !video.ended;
      dugme.setAttribute("aria-pressed", oynuyor ? "true" : "false");
      dugme.setAttribute("aria-label", oynuyor ? dugme.dataset.durdur : dugme.dataset.oynat);
    };
    const oynat = () => video.play().catch(() => durum());

    /* 30 sn sınırı: video uzunsa 30. saniyede başa sarar (döngü); ilerleme halkası */
    video.addEventListener("timeupdate", () => {
      const sinir = Math.min(sure, video.duration || sure);
      if (video.currentTime >= sinir) video.currentTime = 0;
      dugme.style.setProperty("--shn-ilerleme", String(Math.min(1, video.currentTime / sinir)));
    });
    video.addEventListener("play", durum);
    video.addEventListener("pause", durum);
    dugme.addEventListener("click", () => {
      if (video.paused) { kullaniciDurdurdu = false; video.style.display = "block"; oynat(); }
      else { kullaniciDurdurdu = true; video.pause(); }
    });

    /* hareket azaltma: otomatik oynatmayı durdur (poster görünür); kullanıcı isterse düğmeyle oynatır */
    const hareketKontrol = () => { if (azHareket.matches) { video.pause(); video.removeAttribute("autoplay"); } };
    hareketKontrol();
    azHareket.addEventListener("change", hareketKontrol);

    /* ekran dışındayken dur, geri gelince (kullanıcı durdurmadıysa) sür — pil ve bant tasarrufu */
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((g) => {
        if (!g[0]) return;
        if (g[0].isIntersecting) { if (!kullaniciDurdurdu && !azHareket.matches && video.hasAttribute("autoplay")) oynat(); }
        else if (!video.paused) video.pause();
      }, { threshold: 0.2 }).observe(video);
    }
    durum();
  })();
</script>
