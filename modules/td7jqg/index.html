  .modulex-sayac-ray-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 280px); gap: 16px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block-end: 4px; }

<script>
  (() => {
    const P = "modulex-sayac-ray";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
